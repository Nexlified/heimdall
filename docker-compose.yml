services:
  nats:
    image: nats:2.10-alpine
    ports:
      - "4222:4222"  # Client port
      - "8222:8222"  # Monitoring port
    command: "-js -m 8222"  # Enable JetStream (for persistence)

  kratos-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kratos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-kratos}
    ports:
      - "5432:5432"
    volumes:
      - kratos_data:/var/lib/postgresql/data

  kratos-migrate:
    image: oryd/kratos:v1.1
    depends_on:
      - kratos-db
    environment:
      DSN: ${KRATOS_DSN:?KRATOS_DSN must be set}
    volumes:
      - ./infra/kratos/:/etc/config/kratos/
    command: migrate sql -e -c /etc/config/kratos/kratos.yml --yes
    restart: on-failure

  kratos:
    image: oryd/kratos:v1.1
    ports:
      - "4433:4433"  # Public API
      - "4434:4434"  # Admin API
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
    environment:
      DSN: ${KRATOS_DSN:?KRATOS_DSN must be set}
      KRATOS_SERVE_PUBLIC_HOST: "http://localhost:4433"
      KRATOS_SERVE_ADMIN_HOST: "http://kratos:4434"
      KRATOS_COURIER_SMTP_CONNECTION_URI: >-
        smtps://test:test@mailslurper:1025/?skip_ssl_verify=true
    volumes:
      - ./infra/kratos/:/etc/config/kratos/
    command: >-
      serve -c /etc/config/kratos/kratos.yml --dev --watch-courier

  hydra:
    image: oryd/hydra:v2.2
    ports:
      - "4444:4444"  # Public API
      - "4445:4445"  # Admin API
    depends_on:
      - kratos
    environment:
      DSN: ${HYDRA_DSN:-memory}  # For dev; use postgres in production
      OIDC_SUBJECT_IDENTIFIERS_SUPPORTED_TYPES: "public"
      OIDC_SUBJECT_IDENTIFIERS_PAIRWISE_SALT: >-
        ${HYDRA_OIDC_SALT:?HYDRA_OIDC_SALT must be set}
      URLS_SELF_ISSUER: "http://localhost:4444/"
      # Point to Kratos
      URLS_LOGIN: "http://localhost:4433/self-service/login/browser"
      # Point to Heimdall (or a UI)
      URLS_CONSENT: "http://localhost:8080/consent"
      SECRETS_SYSTEM: ${HYDRA_SECRETS_SYSTEM:?HYDRA_SECRETS_SYSTEM must be set}
    command: "serve all --dangerous-force-http"

  cerbos:
    image: docker.io/cerbos/cerbos:0.47.0
    ports:
      - "3592:3592"  # gRPC (Admin)
      - "3593:3593"  # HTTP
    volumes:
      - ./infra/cerbos/policies:/policies
      - ./infra/cerbos/config.yaml:/config/config.yaml
    command: >-
      server --config=/config/config.yaml
      --set=storage.disk.directory=/policies

  heimdall:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - nats
      - kratos
      - hydra
      - cerbos
    environment:
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      KRATOS_ADMIN_URL: ${KRATOS_ADMIN_URL:-http://kratos:4434}
      HYDRA_ADMIN_URL: ${HYDRA_ADMIN_URL:-http://hydra:4445}
      CERBOS_GRPC_URL: ${CERBOS_GRPC_URL:-cerbos:3592}
      # Must be 32 bytes
      PASETO_SYMMETRIC_KEY: >-
        ${PASETO_SYMMETRIC_KEY:?PASETO_SYMMETRIC_KEY must be set}

volumes:
  kratos_data:
